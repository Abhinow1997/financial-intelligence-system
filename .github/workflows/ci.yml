name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install shared libs
        run: pip install -e libs/fin_common -e libs/fin_schemas -e libs/fin_telemetry

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # Blocking evaluation gate (wired up in R4/R6). Fails the build when quality,
  # cost, or latency regress past the acceptance thresholds.
  eval-gate:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run eval gate
        run: python scripts/run_eval_gate.py
