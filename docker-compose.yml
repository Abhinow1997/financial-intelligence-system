# Financial Intelligence System - local orchestration.
#
# Profiles let you start only what you need:
#   docker compose --profile core up            # gateway + backend + frontend + model + rag + agent
#   docker compose --profile data up            # datastores only (postgres/redis/qdrant/minio/redpanda)
#   docker compose --profile full up            # everything
#
# Add more services by copying a block below - they all follow the same shape.

x-python-svc: &python-svc
  restart: unless-stopped
  env_file: .env

services:
  # ---------------- Core serving path ----------------
  gateway:
    <<: *python-svc
    build: ./services/gateway
    ports: ["8080:8080"]
    profiles: ["core", "full"]
    depends_on: [backend]

  backend:
    <<: *python-svc
    build: ./services/backend
    ports: ["8000:8000"]
    profiles: ["core", "full"]
    depends_on: [model_service, retriever]

  frontend:
    <<: *python-svc
    build: ./services/frontend
    environment:
      GATEWAY_URL: http://gateway:8080
    ports: ["8501:8501"]
    profiles: ["core", "full"]
    depends_on: [gateway]

  # ---------------- Analytics / R1 ----------------
  model_service:
    <<: *python-svc
    build: ./services/analytics/model_service
    ports: ["8302:8302"]
    profiles: ["core", "full"]

  feature_store:
    <<: *python-svc
    build: ./services/analytics/feature_store
    ports: ["8301:8301"]
    profiles: ["full"]

  # ---------------- RAG / R2 ----------------
  retriever:
    <<: *python-svc
    build: ./services/rag/retriever
    ports: ["8402:8402"]
    profiles: ["core", "full"]

  indexer:
    <<: *python-svc
    build: ./services/rag/indexer
    ports: ["8401:8401"]
    profiles: ["full"]

  # ---------------- Agents / R3 ----------------
  tool_registry:
    <<: *python-svc
    build: ./services/agents/tool_registry
    ports: ["8510:8510"]
    profiles: ["full"]

  agent_runtime:
    <<: *python-svc
    build: ./services/agents/agent_runtime
    ports: ["8511:8511"]
    profiles: ["core", "full"]
    depends_on: [tool_registry]

  mcp_server:
    <<: *python-svc
    build: ./services/agents/mcp_server
    ports: ["8512:8512"]
    profiles: ["full"]

  # ---------------- Ingestion (workers) ----------------
  market_data:
    <<: *python-svc
    build: ./services/ingestion/market_data
    ports: ["8101:8101"]
    profiles: ["full"]

  filings:
    <<: *python-svc
    build: ./services/ingestion/filings
    ports: ["8102:8102"]
    profiles: ["full"]

  news:
    <<: *python-svc
    build: ./services/ingestion/news
    ports: ["8103:8103"]
    profiles: ["full"]

  # ---------------- Assurance / platform ----------------
  eval_service:
    <<: *python-svc
    build: ./services/evaluation/eval_service
    ports: ["8601:8601"]
    profiles: ["full"]

  guardrails:
    <<: *python-svc
    build: ./services/security/guardrails
    ports: ["8701:8701"]
    profiles: ["full"]

  policy_engine:
    <<: *python-svc
    build: ./services/platform/policy_engine
    ports: ["8803:8803"]
    profiles: ["full"]

  observability:
    <<: *python-svc
    build: ./services/platform/observability
    ports: ["8804:8804"]
    profiles: ["full"]

  finops:
    <<: *python-svc
    build: ./services/platform/finops
    ports: ["8805:8805"]
    profiles: ["full"]

  # ================= Datastores (big-data backbone) =================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fis
      POSTGRES_PASSWORD: fis
      POSTGRES_DB: fis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    profiles: ["data", "full"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["data", "full"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant:/qdrant/storage"]
    profiles: ["data", "full"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fis
      MINIO_ROOT_PASSWORD: fisfisfis
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
    profiles: ["data", "full"]

  redpanda:
    image: redpandadata/redpanda:latest
    command: redpanda start --smp 1 --overprovisioned --node-id 0 --check=false
    ports: ["9092:9092"]
    profiles: ["data", "full"]

volumes:
  pgdata:
  qdrant:
  minio:
